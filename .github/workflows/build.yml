name: Build APK (from zip)

# Suba o zip do projeto na raiz do repositório (ex.: projeto.zip)
# e rode este workflow em Actions > Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["*.zip"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar o projeto
        run: |
          set -e
          ZIP=$(ls *.zip | head -n 1)
          echo "Usando $ZIP"
          mkdir -p src-project
          unzip -q "$ZIP" -d src-project
          # se o zip tem uma pasta única por fora (ex.: AIDE-OS-main), entra nela
          DIR=src-project
          if [ ! -f "$DIR/gradlew" ]; then
            DIR=$(dirname "$(find src-project -maxdepth 3 -name gradlew | head -n 1)")
          fi
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          chmod +x "$DIR/gradlew"

      # gradle/gradle-daemon-jvm.properties pede JDK 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # O runner já traz o Android SDK (ANDROID_HOME). Só aceitamos as licenças
      # e deixamos o Gradle baixar a plataforma 37 que precisar.
      - name: Licenças do SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(command -v sdkmanager || true)
          echo "sdkmanager: $SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-37" || true
          fi
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.PROJECT_DIR }}

      - name: Compilar APK debug
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AIDE-OS-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
